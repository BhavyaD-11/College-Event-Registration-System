
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | College Event Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                Campus<span>Events</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <main class="auth-section">

        <div class="form-card">

            <h1>Create Account</h1>

            <p class="form-subtitle">
                Join the campus community and discover new events.
            </p>

            <div id="signupMessage"
                 class="message hidden"
                 role="status">
            </div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="signupName">Full Name</label>

                    <input
                        type="text"
                        id="signupName"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupRoll">Roll Number</label>

                    <input
                        type="text"
                        id="signupRoll"
                        name="rollNumber"
                        placeholder="Enter your college roll number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">College Email</label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupDepartment">Department</label>

                    <select
                        id="signupDepartment"
                        name="department"
                        required
                    >
                        <option value="">Select your department</option>
                        <option value="CSE">Computer Science</option>
                        <option value="AIML">Artificial Intelligence & ML</option>
                        <option value="IT">Information Technology</option>
                        <option value="ECE">Electronics & Communication</option>
                        <option value="EEE">Electrical & Electronics</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Create Password</label>

                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Account
                </button>

            </form>

            <p class="form-footer">
                Already registered?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                © 2026 College Event Registration.
            </div>
        </div>
    </footer>

</body>
</html>
