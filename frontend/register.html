
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration | College Event Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                Campus<span>Events</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="my-registrations.html">My Registrations</a>
            </nav>
        </div>
    </header>

    <section class="page-banner">
        <div class="container">
            <h1>Event Registration</h1>

            <p>
                Complete the form to register for your chosen event.
            </p>
        </div>
    </section>

    <main class="auth-section">

        <div class="form-card">

            <h1>Register Now</h1>

            <p class="form-subtitle">
                Enter your details below.
            </p>

            <div id="registerMessage"
                 class="message hidden"
                 role="status">
            </div>

            <form id="eventRegistrationForm">

                <div class="form-group">
                    <label for="eventName">Select Event</label>

                    <select id="eventName" name="eventName" required>
                        <option value="">Choose an event</option>
                        <option value="techfest">TechFest 2026</option>
                        <option value="rhythm">Rhythm & Beats</option>
                        <option value="startup">Startup Spark</option>
                        <option value="sports">Campus Sports Day</option>
                        <option value="ai-day">AI Innovation Day</option>
                        <option value="canvas">Creative Canvas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentName">Full Name</label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentRoll">Roll Number</label>

                    <input
                        type="text"
                        id="studentRoll"
                        name="rollNumber"
                        placeholder="Enter your roll number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>

                    <input
                        type="email"
                        id="studentEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentPhone">Mobile Number</label>

                    <input
                        type="tel"
                        id="studentPhone"
                        name="phone"
                        placeholder="Enter your mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentYear">Academic Year</label>

                    <select id="studentYear" name="year" required>
                        <option value="">Select academic year</option>
                        <option value="1">First Year</option>
                        <option value="2">Second Year</option>
                        <option value="3">Third Year</option>
                        <option value="4">Fourth Year</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit Registration
                </button>

            </form>

            <p class="form-footer">
                <a href="events.html">← Back to Events</a>
            </p>

        </div>

    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                © 2026 College Event Registration.
            </div>
        </div>
    </footer>

</body>
</html>
